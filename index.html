<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muntlig Validering & VM-labb – YH03178</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #273549;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.14);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.14);
      --vg: #f59e0b;
      --vg-bg: rgba(245, 158, 11, 0.16);
      --career: #c084fc;
      --career-bg: rgba(192, 132, 252, 0.16);
      --code-bg: #0b1120;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
    }

    body.light {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #475569;
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --success: #16a34a;
      --success-bg: rgba(22, 163, 74, 0.1);
      --danger: #dc2626;
      --danger-bg: rgba(220, 38, 38, 0.1);
      --vg: #d97706;
      --vg-bg: rgba(217, 119, 6, 0.12);
      --career: #7e22ce;
      --career-bg: rgba(126, 34, 206, 0.12);
      --code-bg: #f1f5f9;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 1.25rem;
      transition: background 0.2s, color 0.2s;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    button, select {
      font-family: inherit;
      font-size: 0.88rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0.5rem 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover, select:hover {
      background: var(--surface-hover);
      border-color: var(--primary);
    }

    button.active {
      background: var(--primary);
      color: #0f172a;
      border-color: var(--primary);
      font-weight: 600;
    }

    body.light button.active {
      color: #ffffff;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.55rem;
      margin-bottom: 1.15rem;
    }

    .tab-btn {
      padding: 0.7rem 0.5rem;
      font-weight: 600;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
    }

    .tab-btn span.tab-desc {
      font-size: 0.73rem;
      font-weight: 400;
      opacity: 0.85;
    }

    .filters {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    select {
      max-width: 290px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.45rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.15rem;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }

    .badge {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.14);
      color: var(--primary);
    }

    .badge.vg {
      background: var(--vg-bg);
      color: var(--vg);
    }

    .badge.career {
      background: var(--career-bg);
      color: var(--career);
    }

    .flag-btn {
      font-size: 0.8rem;
      padding: 0.3rem 0.65rem;
    }

    .flag-btn.flagged {
      background: var(--vg-bg);
      border-color: var(--vg);
      color: var(--vg);
      font-weight: 600;
    }

    .question-text {
      font-size: 1.12rem;
      font-weight: 600;
      margin-bottom: 1.1rem;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .option-btn {
      text-align: left;
      padding: 0.82rem 1rem;
      font-size: 0.94rem;
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      line-height: 1.45;
    }

    .option-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--text);
    }

    .option-btn.wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--text);
    }

    .option-letter {
      font-weight: 700;
      color: var(--primary);
      min-width: 1.2rem;
    }

    .feedback-box {
      margin-top: 1.15rem;
      padding: 1rem;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.08);
      border-left: 4px solid var(--primary);
      font-size: 0.93rem;
      display: none;
    }

    .feedback-box.visible {
      display: block;
    }

    .followup-box {
      margin-top: 0.9rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      background: var(--vg-bg);
      border-left: 4px solid var(--vg);
      font-size: 0.91rem;
    }

    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin: 0.7rem 0 0.95rem;
    }

    .keyword-pill {
      font-size: 0.79rem;
      padding: 0.22rem 0.58rem;
      border-radius: 999px;
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: var(--text);
      font-weight: 500;
    }

    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .progress-info {
      font-size: 0.86rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .scenario-box {
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.95rem;
      margin-bottom: 0.95rem;
      font-size: 0.94rem;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: rgba(148, 163, 184, 0.16);
      padding: 0.12rem 0.35rem;
      border-radius: 4px;
      font-size: 0.87em;
    }

    /* VM Lab specific styles */
    .topology-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.75rem;
      margin: 0.9rem 0;
    }

    .vm-node {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      background: rgba(148, 163, 184, 0.05);
      font-size: 0.88rem;
    }

    .vm-node h4 {
      color: var(--primary);
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 10px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin: 0.6rem 0 0.25rem;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--success);
      transition: width 0.25s ease;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin: 0.85rem 0;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      padding: 0.65rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(148, 163, 184, 0.04);
      cursor: pointer;
    }

    .task-item.done {
      background: var(--success-bg);
      border-color: rgba(34, 197, 94, 0.45);
    }

    .task-item input[type="checkbox"] {
      margin-top: 0.25rem;
      width: 16px;
      height: 16px;
      accent-color: var(--success);
      cursor: pointer;
    }

    .cmd-block {
      position: relative;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 4.5rem 0.8rem 0.9rem;
      margin: 0.65rem 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.83rem;
      overflow-x: auto;
      white-space: pre;
      line-height: 1.5;
    }

    .copy-btn {
      position: absolute;
      top: 0.45rem;
      right: 0.45rem;
      font-size: 0.75rem;
      padding: 0.25rem 0.55rem;
    }

    .sabotage-card {
      border-left: 4px solid var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
    }

    @media (max-width: 720px) {
      .tabs {
        grid-template-columns: repeat(2, 1fr);
      }
      .card {
        padding: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Muntlig Validering & VM-labb</h1>
        <p class="subtitle">Grundkurs operativsystem, hårdvara och datacenter (YH03178) – Kursmål 1–17</p>
      </div>
      <div class="header-actions">
        <button id="shuffleBtn" title="Blanda frågor och svarsalternativ">Blanda</button>
        <button id="themeBtn" title="Byt ljust/mörkt tema">Ljust läge</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Övningslägen">
      <button class="tab-btn active" data-mode="quiz">
        1. Snabbkollen
        <span class="tab-desc">Flervalsfrågor & facit</span>
      </button>
      <button class="tab-btn" data-mode="flashcards">
        2. Förklara högt
        <span class="tab-desc">Muntliga kort & nyckelord</span>
      </button>
      <button class="tab-btn" data-mode="scenarios">
        3. Scenarioläge
        <span class="tab-desc">Felsökning & arkitektur</span>
      </button>
      <button class="tab-btn" data-mode="vmlab">
        4. VM-labb
        <span class="tab-desc">Skarp övning & sabotage</span>
      </button>
    </nav>

    <section class="filters" id="filterBar" aria-label="Filter">
      <div class="filter-group">
        <select id="groupFilter" aria-label="Filtrera på huvudområde">
          <option value="all">Alla områden (1–17)</option>
          <option value="Kunskaper">Kunskaper (1–6)</option>
          <option value="Färdigheter">Färdigheter (7–16)</option>
          <option value="Kompetenser">Kompetenser (17)</option>
          <option value="VG">Endast ★VG-krav (7, 8, 12)</option>
        </select>

        <select id="topicFilter" aria-label="Filtrera på specifik punkt">
          <option value="all">Alla delmoment (1–17)</option>
        </select>
      </div>

      <div class="filter-group">
        <button id="flaggedOnlyBtn">Endast markerade (0)</button>
        <span class="progress-info" id="scoreDisplay">Poäng: 0 / 0</span>
      </div>
    </section>

    <main id="appContainer"></main>
  </div>

  <script>
    const TOPICS = [
      { id: 1, group: "Kunskaper", tag: "", title: "1. Datacenter, säkerhet och energi" },
      { id: 2, group: "Kunskaper", tag: "", title: "2. Redundansprincipen" },
      { id: 3, group: "Kunskaper", tag: "", title: "3. Linux- och Windows-servrar" },
      { id: 4, group: "Kunskaper", tag: "", title: "4. Filsystem och behörigheter" },
      { id: 5, group: "Kunskaper", tag: "", title: "5. Backup och återställning" },
      { id: 6, group: "Kunskaper", tag: "", title: "6. Säker konfiguration och åtkomst" },
      { id: 7, group: "Färdigheter", tag: "VG", title: "7. Installera Linux-servrar ★VG" },
      { id: 8, group: "Färdigheter", tag: "VG", title: "8. Användare, behörigheter, fildelning ★VG" },
      { id: 9, group: "Färdigheter", tag: "", title: "9. Windows-server och katalogtjänst" },
      { id: 10, group: "Färdigheter", tag: "", title: "10. Genomföra backup/återställning" },
      { id: 11, group: "Färdigheter", tag: "", title: "11. Härda serverkonfiguration" },
      { id: 12, group: "Färdigheter", tag: "VG", title: "12. Dokumentera konfig. och drift ★VG" },
      { id: 13, group: "Färdigheter", tag: "", title: "13. AI-stöd vid konfig. och felsökning" },
      { id: 14, group: "Färdigheter", tag: "Career", title: "14. Presentera egen kompetens ♦Career" },
      { id: 15, group: "Färdigheter", tag: "Career", title: "15. Urval av organisationer ♦Career" },
      { id: 16, group: "Färdigheter", tag: "", title: "16. Samarbeta i gemensamt Git-repo" },
      { id: 17, group: "Kompetenser", tag: "", title: "17. Bygga och motivera servermiljö" }
    ];

    const QUIZ_DATA = [
      {
        id: "q1", topicId: 1,
        question: "Vad är syftet med ISO 50001 och EU Code of Conduct for Data Centres inom datacenterdrift?",
        options: [
          "Att skapa systematisk energiledning och följa branschpraxis för att minska energiförbrukning, kylläckage och PUE",
          "Att reglera hur många användarkonton som får skapas i Active Directory",
          "Att ersätta behovet av UPS och dieselgeneratorer i serverhallar",
          "Att definiera krypteringsalgoritmer för SSH-nycklar"
        ],
        correct: 0,
        explanation: "ISO 50001 är en internationell standard för systematiskt energiledningsarbete (Plan-Do-Check-Act), medan EU Code of Conduct for Data Centres ger konkreta riktlinjer för energieffektivitet i serverhallar (t.ex. luftflödeshantering, högre tilluftstemperatur och mätning av PUE)."
      },
      {
        id: "q2", topicId: 1,
        question: "Vad mäter nyckeltalet PUE (Power Usage Effectiveness) i ett datacenter?",
        options: [
          "Total energi som går in i datacentret dividerat med energin som går till själva IT-utrustningen",
          "Hur många procent av servrarna som körs på förnybar el",
          "Maximal batteritid i en UPS vid full last",
          "Antalet redundanta kylaggregat per serverrack"
        ],
        correct: 0,
        explanation: "PUE = Total Facility Energy / IT Equipment Energy. Ett PUE nära 1.0 innebär att nästan all energi går till servrarna och minimalt svinn går till kylning och kraftomvandling."
      },
      {
        id: "q3", topicId: 2,
        question: "Vad är den avgörande skillnaden mellan redundansnivåerna N+1 och 2N?",
        options: [
          "N+1 har en extra reservkomponent utöver behovet, medan 2N har två helt oberoende parallella system",
          "N+1 gäller endast hårddiskar och 2N gäller endast nätverkskort",
          "2N kräver dubbelt så många IP-adresser men saknar failover",
          "N+1 ger noll avbrottstid medan 2N kräver manuell omstart"
        ],
        correct: 0,
        explanation: "Om en serverhall behöver 3 kylaggregat (N=3) innebär N+1 totalt 4 aggregat. 2N innebär 3+3 helt separata kedjor (t.ex. dubbla elmatningar A och B hela vägen till serverns dubbla PSU:er)."
      },
      {
        id: "q4", topicId: 2,
        question: "En kollega säger: 'Vi kör RAID 10 på filservern, så vi behöver ingen backup.' Vad är fel i det resonemanget?",
        options: [
          "RAID skyddar mot hårdvarufel på disk, inte mot ransomware, oavsiktlig radering eller korrupta filer",
          "RAID 10 saknar paritet och klarar inte att en disk går sönder",
          "RAID fungerar bara på Windows-servrar och inte på Linux",
          "RAID 10 komprimerar filerna så att de inte går att återställa"
        ],
        correct: 0,
        explanation: "RAID är tillgänglighet (redundans), inte backup. Raderas en fil eller krypteras disken av ransomware speglas den skadan omedelbart till alla diskar i RAID-arrayen."
      },
      {
        id: "q5", topicId: 3,
        question: "Varför rekommenderas ofta Windows Server Core (utan GUI) eller minimal Linux-installation i produktion?",
        options: [
          "Mindre attackyta, lägre resursförbrukning (RAM/CPU) och färre omstarter vid uppdateringar",
          "Det går inte att installera Active Directory eller SSH om ett grafiskt gränssnitt finns",
          "Licenskostnaden blir helt gratis på Windows Server Core",
          "Filsystemen NTFS och ext4 fungerar snabbare utan skrivbordsmiljö"
        ],
        correct: 0,
        explanation: "Färre installerade paket och tjänster ger färre sårbarheter att patcha, lägre minnesåtgång och mer stabil drift."
      },
      {
        id: "q6", topicId: 4,
        question: "Vad innebär rättigheten 2770 (rwxrws---) på en delad projektmapp i Linux?",
        options: [
          "Ägaren och gruppen har fulla rättigheter, övriga saknar åtkomst, och nya filer ärver mappens gruppägarskap (setgid)",
          "Endast root kan radera filer i mappen (sticky bit)",
          "Alla användare i systemet kan läsa men inte skriva",
          "Filerna krypteras automatiskt med 2770-bitars nyckel"
        ],
        correct: 0,
        explanation: "Siffran 2 aktiverar setgid på katalogen, vilket gör att alla nya filer och undermappar automatiskt får samma gruppägare som huvudmappen – avgörande för delade projektmappar."
      },
      {
        id: "q7", topicId: 4,
        question: "Hur beräknas den effektiva behörigheten när en användare ansluter till en Windows-utdelning (SMB Share) över nätverket?",
        options: [
          "Den mest restriktiva kombinationen av Share-behörigheten och NTFS-behörigheten gäller",
          "Share-behörigheten skriver alltid över NTFS-behörigheten",
          "NTFS-behörigheten gäller bara lokalt och ignoreras alltid över nätverk",
          "Användaren får den högsta behörigheten av de två"
        ],
        correct: 0,
        explanation: "Windows utvärderar både Share-rättigheter och NTFS-rättigheter och tillämpar det mest restriktiva utfallet. Därför sätts ofta Share till 'Authenticated Users: Change/Full Control' medan finstyrningen görs i NTFS."
      },
      {
        id: "q8", topicId: 5,
        question: "Vad innebär 3-2-1-regeln inom backupstrategi?",
        options: [
          "3 kopior av datan, på 2 olika lagringsmedier, varav minst 1 kopia offsite (geografiskt skild)",
          "3 fulla backuper i veckan, 2 inkrementella och 1 differentiell",
          "3 timmars RTO, 2 timmars RPO och 1 års lagringstid",
          "3 administratörer, 2 backupservrar och 1 krypteringsnyckel"
        ],
        correct: 0,
        explanation: "3-2-1 skyddar både mot lokal hårdvarukrasch och mot brand/stöld i serverrummet. Idag utökas den ofta till 3-2-1-1-0 (1 offline/immutable och 0 fel vid verifiering)."
      },
      {
        id: "q9", topicId: 5,
        question: "Vad beskriver begreppen RPO och RTO vid en driftstörning?",
        options: [
          "RPO är maximal acceptabel dataförlust i tid; RTO är maximal acceptabel nedtid innan systemet är igång igen",
          "RPO är bandbredden till backupservern; RTO är diskarnas läshastighet",
          "RPO anger hur ofta lösenord byts; RTO anger hur länge loggar sparas",
          "RPO gäller bara molnbackup; RTO gäller bara lokala bandstationer"
        ],
        correct: 0,
        explanation: "Har ni backup var 4:e timme är RPO max 4 timmar. Tar återställningen 2 timmar är RTO 2 timmar."
      },
      {
        id: "q10", topicId: 6,
        question: "Vilken kombination av åtgärder säkrar SSH-åtkomst mot brute-force-attacker mest effektivt?",
        options: [
          "Nyckelbaserad autentisering (PubkeyAuthentication), PasswordAuthentication no och PermitRootLogin no",
          "Att enbart byta SSH-port från 22 till 2222 och behålla lösenordsinloggning",
          "Att tillåta root-inloggning men aktivera Telnet som reserv",
          "Att ställa in chmod 777 på ~/.ssh/authorized_keys"
        ],
        correct: 0,
        explanation: "Att stänga av lösenordsinloggning och direkt root-login eliminerar risken för gissade lösenord. Dessutom kräver SSH strikta rättigheter (700 på ~/.ssh och 600 på authorized_keys)."
      },
      {
        id: "q11", topicId: 7,
        question: "Vad används verktyg som Ubuntu Autoinstall (cloud-init), Kickstart eller Preseed till enligt kursmål 7?",
        options: [
          "Automatiserad och repeterbar installation av Linux-servrar utifrån en deklarativ konfigurationsfil",
          "Att övervaka CPU-temperatur i fysiska datacenter",
          "Att konvertera NTFS-partitioner till ext4 utan dataförlust",
          "Att generera Group Policy Objects i Active Directory"
        ],
        correct: 0,
        explanation: "Automatiserad installation (t.ex. cloud-init/autoinstall med user-data YAML) gör att servrar kan installeras identiskt, snabbt och utan manuella klickfel – ett centralt VG-moment."
      },

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function shuffleQuestionOptions(q) {
      const correctText = q.options[q.correct];
      shuffleArray(q.options);
      q.correct = q.options.indexOf(correctText);
    }

    });

    function saveFlagged() {
      localStorage.setItem("validering_flagged", JSON.stringify(state.flagged));
      updateFlagButton();
    }

    function saveVmChecks() {
      localStorage.setItem("validering_vm_checks", JSON.stringify(state.vmChecked));
    }

    function updateFlagButton() {
      const btn = document.getElementById("flaggedOnlyBtn");
      btn.textContent = `Endast markerade (${state.flagged.length})`;
      btn.classList.toggle("active", state.flaggedOnly);
    }

    function toggleFlag(itemId) {
      if (state.flagged.includes(itemId)) {
        state.flagged = state.flagged.filter(id => id !== itemId);
      } else {
        state.flagged.push(itemId);
      }
      saveFlagged();
      render();
    }

    function getTopicById(id) {
      return TOPICS.find(t => t.id === id) || TOPICS[0];
    }

    function getFilteredItems() {
      let source = state.mode === "quiz"
        ? QUIZ_DATA
        : state.mode === "flashcards"
          ? FLASHCARD_DATA
          : SCENARIO_DATA;

      return source.filter(item => {
        const topic = getTopicById(item.topicId);
        if (state.groupFilter === "VG" && topic.tag !== "VG") return false;
        if (state.groupFilter !== "all" && state.groupFilter !== "VG" && topic.group !== state.groupFilter) return false;
        if (state.topicFilter !== "all" && String(item.topicId) !== state.topicFilter) return false;
        if (state.flaggedOnly && !state.flagged.includes(item.id)) return false;
        return true;
      });
    }

    function renderBadges(topic) {
      let html = `<span class="badge">${topic.group}</span>`;
      html += `<span class="badge">${topic.title}</span>`;
      if (topic.tag === "VG") html += `<span class="badge vg">★VG-krav</span>`;
      if (topic.tag === "Career") html += `<span class="badge career">♦Career (Karriärcoach)</span>`;
      return html;
    }

    function render() {
      const filterBar = document.getElementById("filterBar");
      const shuffleBtn = document.getElementById("shuffleBtn");

      if (state.mode === "vmlab") {
        filterBar.style.display = "none";
        shuffleBtn.style.display = "none";
        renderVmLab(document.getElementById("appContainer"));
        return;
      }

      filterBar.style.display = "flex";
      shuffleBtn.style.display = "inline-block";

      updateFlagButton();
      const totalAnswered = Object.keys(state.answered).length;
      document.getElementById("scoreDisplay").textContent = `Snabbkollen: ${state.score} / ${totalAnswered} rätt`;

      const container = document.getElementById("appContainer");
      const items = getFilteredItems();

      if (items.length === 0) {
        container.innerHTML = `
          <div class="card empty-state">
            <p>Inga frågor matchar ditt nuvarande filter.</p>
            <br />
            <button onclick="resetFilters()">Återställ filter</button>
          </div>
        `;
        return;
      }

      if (state.currentIndex >= items.length) state.currentIndex = 0;
      if (state.currentIndex < 0) state.currentIndex = items.length - 1;

      const item = items[state.currentIndex];
      const topic = getTopicById(item.topicId);
      const isFlagged = state.flagged.includes(item.id);

      if (state.mode === "quiz") {
        renderQuizCard(container, item, topic, isFlagged, items.length);
      } else if (state.mode === "flashcards") {
        renderFlashcard(container, item, topic, isFlagged, items.length);
      } else {
        renderScenarioCard(container, item, topic, isFlagged, items.length);
      }
    }

    function renderQuizCard(container, item, topic, isFlagged, total) {
      const userChoiceText = state.answered[item.id];
      const hasAnswered = userChoiceText !== undefined;
      const correctText = item.options[item.correct];
      const letters = ["A", "B", "C", "D"];

      let optionsHtml = item.options.map((opt, idx) => {
        let cls = "option-btn";
        if (hasAnswered) {
          if (opt === correctText) cls += " correct";
          else if (opt === userChoiceText) cls += " wrong";
        }
        return `
          <button class="${cls}" ${hasAnswered ? "disabled" : ""} onclick="answerQuiz('${item.id}', ${idx})">
            <span class="option-letter">${letters[idx]}.</span>
            <span>${opt}</span>
          </button>
        `;
      }).join("");

      container.innerHTML = `
        <article class="card">
          <div class="meta-row">
            <div class="badges">${renderBadges(topic)}</div>
            <button class="flag-btn ${isFlagged ? "flagged" : ""}" onclick="toggleFlag('${item.id}')">
              ${isFlagged ? "★ Markerad som osäker" : "☆ Markera som osäker"}
            </button>
          </div>

          <div class="question-text">${item.question}</div>
          <div class="options">${optionsHtml}</div>

          <div class="feedback-box ${hasAnswered ? "visible" : ""}">
            <strong>${userChoiceText === correctText ? "Rätt!" : "Inte riktigt."}</strong> ${item.explanation}
          </div>
        </article>

        <div class="nav-controls">
          <button onclick="navigate(-1)">← Föregående</button>
          <span class="progress-info">Fråga ${state.currentIndex + 1} av ${total}</span>
          <button onclick="navigate(1)">Nästa →</button>
        </div>
      `;
    }

    function renderFlashcard(container, item, topic, isFlagged, total) {
      const isRevealed = !!state.revealed[item.id];
      const keywordsHtml = item.keywords.map(k => `<span class="keyword-pill">✓ ${k}</span>`).join("");

      container.innerHTML = `
        <article class="card">
          <div class="meta-row">
            <div class="badges">${renderBadges(topic)}</div>
            <button class="flag-btn ${isFlagged ? "flagged" : ""}" onclick="toggleFlag('${item.id}')">
              ${isFlagged ? "★ Markerad som osäker" : "☆ Markera som osäker"}
            </button>
          </div>

          <p class="subtitle" style="margin-bottom: 0.4rem;">Svara högt med egna ord innan du vänder kortet:</p>
          <div class="question-text">${item.question}</div>

          <button class="active" onclick="toggleReveal('${item.id}')">
            ${isRevealed ? "Dölj facit & nyckelord" : "Visa nyckelord & mönstersvar"}
          </button>

          <div class="feedback-box ${isRevealed ? "visible" : ""}">
            <strong>Nyckelord som examinatorn vill höra:</strong>
            <div class="keywords">${keywordsHtml}</div>
            <p><strong>Exempel på bra svar:</strong><br/>${item.modelAnswer}</p>
            <div class="followup-box">
              <strong>Examinatorns följdfråga:</strong> ${item.followup}
            </div>
          </div>
        </article>

        <div class="nav-controls">
          <button onclick="navigate(-1)">← Föregående</button>
          <span class="progress-info">Kort ${state.currentIndex + 1} av ${total}</span>
          <button onclick="navigate(1)">Nästa →</button>
        </div>
      `;
    }

    function renderScenarioCard(container, item, topic, isFlagged, total) {
      const isRevealed = !!state.revealed[item.id];
      const formattedSolution = item.solution.replace(/\n/g, "<br/>");

      container.innerHTML = `
        <article class="card">
          <div class="meta-row">
            <div class="badges">${renderBadges(topic)}</div>
            <button class="flag-btn ${isFlagged ? "flagged" : ""}" onclick="toggleFlag('${item.id}')">
              ${isFlagged ? "★ Markerad som osäker" : "☆ Markera som osäker"}
            </button>
          </div>

          <div class="question-text">${item.title}</div>
          <div class="scenario-box">${item.scenario}</div>
          <p style="font-weight: 600; margin-bottom: 1rem;">Uppgift: ${item.promptQuestion}</p>

          <button class="active" onclick="toggleReveal('${item.id}')">
            ${isRevealed ? "Dölj felsökning & lösning" : "Visa orsak & lösning"}
          </button>

          <div class="feedback-box ${isRevealed ? "visible" : ""}">
            <p style="margin-bottom: 0.75rem;"><strong>Grundorsak:</strong> ${item.rootCause}</p>
            <p><strong>Åtgärd & motivering:</strong><br/>${formattedSolution}</p>
          </div>
        </article>

        <div class="nav-controls">
          <button onclick="navigate(-1)">← Föregående</button>
          <span class="progress-info">Scenario ${state.currentIndex + 1} av ${total}</span>
          <button onclick="navigate(1)">Nästa →</button>
        </div>
      `;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderVmLab(container) {
      const allTasks = VM_LAB_MODULES.flatMap(m => m.tasks);
      const completedCount = allTasks.filter(t => state.vmChecked[t.id]).length;
      const pct = Math.round((completedCount / allTasks.length) * 100);

      let modulesHtml = VM_LAB_MODULES.map(mod => {
        let tasksHtml = mod.tasks.map(t => {
          const checked = !!state.vmChecked[t.id];
          return `
            <label class="task-item ${checked ? "done" : ""}">
              <input type="checkbox" ${checked ? "checked" : ""} onchange="toggleVmTask('${t.id}')" />
              <span>${t.text}</span>
            </label>
          `;
        }).join("");

        return `
          <article class="card">
            <div class="meta-row">
              <div class="badges"><span class="badge">${mod.badge}</span></div>
            </div>
            <div class="question-text" style="margin-bottom: 0.35rem;">${mod.title}</div>
            <p class="subtitle" style="margin-bottom: 0.75rem;">${mod.goal}</p>

            <div class="task-list">${tasksHtml}</div>

            <p style="font-size: 0.85rem; font-weight: 600; margin-top: 0.75rem;">Verifieringskommandon:</p>
            <div class="cmd-block"><button class="copy-btn" data-copy="${escapeHtml(mod.commands)}">Kopiera</button>${escapeHtml(mod.commands)}</div>

            <div class="followup-box">
              <strong>Träna inför skärmdelningen:</strong> ${mod.examinerCheck}
            </div>
          </article>
        `;
      }).join("");

      let sabotageHtml = SABOTAGE_CHALLENGES.map(sab => {
        const isOpen = !!state.revealed[sab.id];
        return `
          <article class="card sabotage-card">
            <div class="question-text" style="font-size: 1.02rem; margin-bottom: 0.5rem;">${sab.title}</div>
            <p style="font-size: 0.92rem; margin-bottom: 0.5rem;"><strong>1. Kompisens åtgärd (titta bort!):</strong> ${sab.setupForPartner}</p>
            <p style="font-size: 0.92rem; margin-bottom: 0.85rem;"><strong>2. Symptom:</strong> ${sab.symptom}</p>
            <button onclick="toggleReveal('${sab.id}')">${isOpen ? "Dölj felsökningsstöd" : "Visa felsökningsstöd"}</button>
            <div class="feedback-box ${isOpen ? "visible" : ""}">
              <strong>Systematisk felsökning:</strong> ${sab.hint}
            </div>
          </article>
        `;
      }).join("");

      container.innerHTML = `
        <section class="card">
          <div class="meta-row" style="margin-bottom: 0.4rem;">
            <div class="badges">
              <span class="badge">Praktisk VM-övning</span>
              <span class="badge vg">Täcker mål 1–13, 16, 17</span>
            </div>
            <button onclick="resetVmChecks()" style="font-size: 0.8rem; padding: 0.3rem 0.65rem;">Nollställ checklista</button>
          </div>
          <div class="question-text" style="margin-bottom: 0.3rem;">Bygg & verifiera er miniproduktionsmiljö i VirtualBox / VMware</div>
          <p class="subtitle">Tips: Ta en <strong>Snapshot</strong> på rena VM:ar innan ni börjar så kan ni snabbt backa och öva om!</p>

          <div class="topology-grid">
            <div class="vm-node">
              <h4>1. vm-linux-01 (Ubuntu Server)</h4>
              <p>IP: <code>192.168.56.10/24</code><br/>Roll: Filserver (Samba), backup-mål, härdad SSH/UFW + Lynis.</p>
            </div>
            <div class="vm-node">
              <h4>2. vm-win-dc01 (Windows Server)</h4>
              <p>IP: <code>192.168.56.20/24</code><br/>Roll: Active Directory (AD DS), DNS-server, OU-struktur & GPO.</p>
            </div>
            <div class="vm-node">
              <h4>3. vm-win-cli01 (Windows 10/11)</h4>
              <p>IP: <code>192.168.56.30</code> (DNS: <code>.20</code>)<br/>Roll: Domänklient för inloggning, <code>gpresult</code> och SMB-test.</p>
            </div>
          </div>

          <div style="margin-top: 0.85rem;">
            <div style="display: flex; justify-content: space-between; font-size: 0.86rem; font-weight: 600;">
              <span>Labprogress</span>
              <span>${completedCount} / ${allTasks.length} steg klara (${pct}%)</span>
            </div>
            <div class="progress-bar-wrap">
              <div class="progress-bar-fill" style="width: ${pct}%"></div>
            </div>
          </div>
        </section>

        ${modulesHtml}

        <h2 style="font-size: 1.15rem; margin: 1.5rem 0 0.75rem;">Sabotage-utmaningen (Kör två och två inför valideringen)</h2>
        <p class="subtitle" style="margin-bottom: 0.9rem;">Enligt kursplanen kan ett arbete med brister godkännas om du kan förklara vad som inte fungerar och hur det åtgärdas. Turas om att sabotera och felsöka med skärmdelning!</p>
        ${sabotageHtml}
      `;
    }

    window.toggleVmTask = function(taskId) {
      state.vmChecked[taskId] = !state.vmChecked[taskId];
      saveVmChecks();
      render();
    };

    window.resetVmChecks = function() {
      state.vmChecked = {};
      saveVmChecks();
      render();
    };

    window.answerQuiz = function(id, choiceIndex) {
      if (state.answered[id] !== undefined) return;
      const q = QUIZ_DATA.find(item => item.id === id);
      if (!q) return;
      const chosenText = q.options[choiceIndex];
      state.answered[id] = chosenText;
      if (choiceIndex === q.correct) {
        state.score += 1;
      }
      render();
    };

    window.toggleReveal = function(id) {
      state.revealed[id] = !state.revealed[id];
      render();
    };

    window.navigate = function(step) {
      state.currentIndex += step;
      render();
    };

    window.resetFilters = function() {
      state.groupFilter = "all";
      state.topicFilter = "all";
      state.flaggedOnly = false;
      state.currentIndex = 0;
      document.getElementById("groupFilter").value = "all";
      document.getElementById("topicFilter").value = "all";
      render();
    };

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.mode = btn.dataset.mode;
        state.currentIndex = 0;
        render();
      });
    });

    document.getElementById("groupFilter").addEventListener("change", e => {
      state.groupFilter = e.target.value;
      state.currentIndex = 0;
      render();
    });

    document.getElementById("topicFilter").addEventListener("change", e => {
      state.topicFilter = e.target.value;
      state.currentIndex = 0;
      render();
    });

    document.getElementById("flaggedOnlyBtn").addEventListener("click", () => {
      state.flaggedOnly = !state.flaggedOnly;
      state.currentIndex = 0;
      render();
    });

    document.getElementById("shuffleBtn").addEventListener("click", () => {
      shuffleArray(QUIZ_DATA);
      QUIZ_DATA.forEach(shuffleQuestionOptions);
      shuffleArray(FLASHCARD_DATA);
      shuffleArray(SCENARIO_DATA);
      state.currentIndex = 0;
      render();
    });

    document.getElementById("themeBtn").addEventListener("click", e => {
      document.body.classList.toggle("light");
      e.target.textContent = document.body.classList.contains("light") ? "Mörkt läge" : "Ljust läge";
    });

    document.addEventListener("click", e => {
      if (e.target.classList.contains("copy-btn")) {
        const text = e.target.getAttribute("data-copy");
        navigator.clipboard.writeText(text).then(() => {
          const orig = e.target.textContent;
          e.target.textContent = "Kopierad!";
          setTimeout(() => { e.target.textContent = orig; }, 1500);
        });
      }
    });

    document.addEventListener("keydown", e => {
      if (e.target.tagName === "SELECT" || state.mode === "vmlab") return;
      if (e.key === "ArrowRight") navigate(1);
      if (e.key === "ArrowLeft") navigate(-1);
    });

    render();
  </script>
</body>
</html>
